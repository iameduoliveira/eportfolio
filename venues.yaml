# Venues: the reviewed list of where the team publishes.
#
# For each venue:
#   type:     journal | conference | book | preprint | other   (overrides OpenAlex, which is sometimes wrong)
#   rank:     optional - leave it out to use SCImago (journals) / ICORE (conferences) automatically,
#             or set it yourself: Q1 Q2 Q3 Q4 (journals), A* A B C (ICORE or ABDC), Australasian, unranked
#   label:    optional - the name to show on the site
#   reviewed: set to true once you've checked the line; unreviewed venues are marked 'not verified' on the site
#
# 'aliases' merges different spellings of the same venue into one (left: other spelling, right: the name used below).
# Names come from OpenAlex, or from Google Scholar when OpenAlex only has a preprint, a publisher series (e.g. LNCS)
# or nothing at all - those lines say 'from Scholar'. New venues found later are listed in data/venues_to_review.yaml.
# Sorted by number of papers in the last 5 years. CHECK = this draft disagrees with OpenAlex about the type.

