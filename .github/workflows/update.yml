name: Update and publish site

on:
  schedule:
    - cron: "17 3 1 * *"      # 03:17 UTC on the 1st of every month (about 2:17 pm in Melbourne)
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write    # save the refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Publications: only on the monthly schedule or when you press "Run workflow".
      # Pushing content changes just rebuilds the pages from the data already in the repo.
      - name: Fetch publications (OpenAlex + Google Scholar)
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python pipeline/fetch.py --out data/dashboard

      - name: Build research data
        run: python scripts/prepare_research.py

      - name: Build page content from content/*.yaml
        run: python scripts/build_content.py

      - name: Save refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet && exit 0
          git commit -m "Update publications $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "::warning::Could not save the refreshed data to the repo; the site is still published from this run."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
