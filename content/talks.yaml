# talks.yaml — the Projects & talks page.
#   projects: cards at the top of the page (projects you contribute to)
#   service:  conference committees, editorial roles and other service to the research community (newest first)
#   service_note: one line shown under the service list (e.g. programme committees and reviewing)
#   featured: highlighted writing, shown above the talks
#   type:  Keynote or invited talk | Workshop | University seminar | Writing | In the media
#   label: the badge shown (Keynote, Invited talk, Panel, Article, ...)
#   place: a key from 'places' (add new places with lat/lon to put them on the map)
#   year:  leave empty (null) if unknown; month is optional (Jan, Feb, ...)

projects:
- kicker: Open software · contributor
  title: Dynalytics
  text: An open framework and software ecosystem in R, Python and JavaScript for analysing dynamic systems, from transition networks to higher-order networks, with built-in statistical validation of every finding.
  link_text: Explore Dynalytics
  url: https://dynasite.org/#/
- kicker: Special issue · guest editor · 2027
  title: 'Evidence of Learning in the Age of Generative AI: From Product to Process'
  text: A Learning Letters special issue I'm guest editing with Kamila Misiejuk, on assessing learning when generative AI can produce the artefact itself, shifting the focus from the finished product to the learning process and the judgement students make within it. Full papers are due 1 February 2027, with publication expected around May 2027.
  link_text: Read the call for papers
  url: https://learningletters.org/index.php/learn/announcement/view/1
