- years: '2024'
  role: Virtual experiences co-chair
  what: International Conference on Artificial Intelligence in Education (AIED 2024), Recife, Brazil
  url: https://aied2024.cesar.school/organization/general-organization
service_note: 'I have been on the program committees for several conferences such as ICSLE, ASCILITE, LAK and AIED, and I regularly review for journals including the Journal of Computer Assisted Learning, the Journal of Educational Data Mining, Smart Learning Environments, Computers & Education, and Computers and Education: Artificial Intelligence.'
featured:
- kicker: Book chapters · open access · 2025
  title: 'Advanced Learning Analytics Methods: AI, Precision and Complexity'
  text: Three chapters on explainable and evaluative AI, large language models in education, and using LLMs to explain predictive models. Led and edited by the (truly) fantastic Mohammed Saqr and Sonsoles López-Pernas (Springer).
  link_text: Read the book
  url: https://link.springer.com/book/10.1007/978-3-031-95365-1
