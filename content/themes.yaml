# themes.yaml — research themes and topics on the Research and Home pages.
#
# themes:   the six themes. `keywords` is a regular expression matched against each paper's title
#           (lower case); a paper can belong to several themes.
# topics:   the words in the "Topics I research" cloud (title keywords, plus OpenAlex keywords via `openalex_keywords`).
# papers:   your corrections. Each paper's `themes` list here WINS over the keywords. Papers are matched by title.
#           New papers from Google Scholar are tagged automatically; add them here only to correct them.
#           Optional per paper:
#             coauthors: [Full Name, ...]  people Google Scholar cut off with "..." (counted in the network)
#             hide: true                   leave this paper off the site
#           Marked # CHECK: papers that need your eye (health papers under AI; papers with no theme).

